<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌿 Quésaco — Maquettes Interactives</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Nunito', sans-serif; background: #0f0f1a; }
button { font-family: 'Nunito', sans-serif; }
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 4px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;



/* ═══════════════════════════════════════════
   QUÉSACO — Maquettes complètes (4 rôles)
   Basé sur les schémas de navigation manuscrits
   ═══════════════════════════════════════════ */

const ROLES = {
  collegien: { label: "🧑‍🎓 Collégien", color: "#2d6a4f", accent: "#52b788" },
  moderateur: { label: "🛡️ Modérateur", color: "#7c2d12", accent: "#f97316" },
  expert: { label: "🔬 Expert", color: "#1e3a5f", accent: "#3b82f6" },
  admin: { label: "⚙️ Administrateur", color: "#4a1d6e", accent: "#a855f7" },
};

// ─────────────── Phone Frame ───────────────
function Phone({ children }) {
  return (
    <div style={{
      width: 370, height: 780, borderRadius: 40, background: "#0a0a0a",
      padding: 10, position: "relative",
      boxShadow: "0 30px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.08)",
      flexShrink: 0,
    }}>
      <div style={{
        position: "absolute", top: 10, left: "50%", transform: "translateX(-50%)",
        width: 120, height: 28, background: "#0a0a0a", borderRadius: "0 0 16px 16px", zIndex: 50,
      }}>
        <div style={{
          width: 10, height: 10, borderRadius: 5, background: "#1a1a1a",
          position: "absolute", top: 8, left: "50%", transform: "translateX(-50%)",
        }} />
      </div>
      <div style={{
        width: "100%", height: "100%", borderRadius: 32, overflow: "hidden",
        background: "#f7f9f4", display: "flex", flexDirection: "column",
      }}>
        <div style={{
          height: 40, background: "#1b1b1b", display: "flex",
          alignItems: "center", justifyContent: "center", flexShrink: 0,
        }}>
          <span style={{ color: "#fff", fontSize: 11, fontWeight: 600, fontFamily: "var(--f)" }}>9:41</span>
        </div>
        {children}
      </div>
    </div>
  );
}

// ─────────────── Shared Components ───────────────
function Header({ title, subtitle, color, onBack }) {
  return (
    <div style={{
      background: `linear-gradient(135deg, ${color}, ${color}dd)`,
      padding: onBack ? "10px 16px" : "16px 20px",
      flexShrink: 0,
    }}>
      {onBack && (
        <button onClick={onBack} style={{
          background: "rgba(255,255,255,0.15)", border: "none", borderRadius: 10,
          width: 32, height: 32, color: "#fff", fontSize: 14, cursor: "pointer",
          marginBottom: 6, display: "flex", alignItems: "center", justifyContent: "center",
        }}>←</button>
      )}
      <h2 style={{ color: "#fff", fontSize: 17, fontWeight: 800, margin: 0, fontFamily: "var(--f)" }}>{title}</h2>
      {subtitle && <p style={{ color: "rgba(255,255,255,0.7)", fontSize: 11, margin: "2px 0 0", fontFamily: "var(--f)" }}>{subtitle}</p>}
    </div>
  );
}

function NavItem({ icon, label, active, onClick }) {
  return (
    <button onClick={onClick} style={{
      border: "none", background: active ? "var(--accent)" : "transparent",
      borderRadius: 14, padding: active ? "7px 14px" : "7px 10px",
      display: "flex", flexDirection: "column", alignItems: "center", gap: 1,
      cursor: "pointer", transition: "all 0.2s",
    }}>
      <span style={{ fontSize: active ? 19 : 17 }}>{icon}</span>
      <span style={{
        fontSize: 9, fontWeight: active ? 700 : 500,
        color: active ? "#fff" : "#9ca3af", fontFamily: "var(--f)",
      }}>{label}</span>
    </button>
  );
}

function Card({ children, style: s, onClick }) {
  return (
    <div onClick={onClick} style={{
      background: "#fff", borderRadius: 14, padding: 14,
      marginBottom: 10, border: "1px solid #eaede7",
      boxShadow: "0 1px 4px rgba(0,0,0,0.03)",
      cursor: onClick ? "pointer" : "default",
      transition: "transform 0.15s", ...s,
    }}>{children}</div>
  );
}

function Badge({ text, bg, color }) {
  return (
    <span style={{
      background: bg, color, borderRadius: 8, padding: "3px 9px",
      fontSize: 10, fontWeight: 700, fontFamily: "var(--f)",
    }}>{text}</span>
  );
}

function Btn({ children, primary, color, onClick, style: s }) {
  return (
    <button onClick={onClick} style={{
      width: "100%", padding: "12px", borderRadius: 14,
      background: primary ? `linear-gradient(135deg, ${color || "var(--main)"}, ${color || "var(--main)"}cc)` : "#fff",
      border: primary ? "none" : `2px solid ${color || "var(--accent)"}`,
      color: primary ? "#fff" : (color || "var(--main)"),
      fontSize: 13, fontWeight: 700, fontFamily: "var(--f)",
      cursor: "pointer", boxShadow: primary ? `0 4px 14px ${color || "var(--main)"}44` : "none",
      ...s,
    }}>{children}</button>
  );
}

// ══════════════════════════════════════════════
//  COLLÉGIEN SCREENS
// ══════════════════════════════════════════════

function C_Accueil({ go }) {

    <div style={{ flex: 1, padding: 16, overflowY: "auto" }}>
      <button onClick={() => go("c_appareil")} style={{
        width: "100%", border: "none", borderRadius: 18,

        <span style={{ marginLeft: "auto", color: "#fff", fontSize: 18 }}>→</span>
      </button>

      <h3 style={{ fontSize: 13, fontWeight: 700, color: "#1b4332", margin: "0 0 10px", fontFamily: "var(--f)" }}>🕐 Récentes</h3>
      {[
        { n: "Coccinelle à 7 points", l: "Parc Citadelle", t: "2h", e: "🐞", c: 94 },
        { n: "Chêne pédonculé", l: "Forêt Phalempin", t: "Hier", e: "🌳", c: 87 },

        <Card key={i}>
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            <div style={{
              width: 42, height: 42, borderRadius: 12,

              display: "flex", alignItems: "center", justifyContent: "center", fontSize: 20,

            <div style={{ flex: 1 }}>
              <p style={{ fontSize: 13, fontWeight: 700, color: "#1b4332", margin: 0, fontFamily: "var(--f)" }}>{it.n}</p>
              <p style={{ fontSize: 10, color: "#6b7280", margin: "2px 0 0", fontFamily: "var(--f)" }}>📍 {it.l} · {it.t}</p>
            </div>
            {it.c > 0 && <Badge text={`${it.c}%`} bg="#d8f3dc" color="#2d6a4f" />}
          </div>
        </Card>
      ))}
    </div>
    <div style={{ height: 70, background: "#fff", borderTop: "1px solid #eaede7", display: "flex", alignItems: "center", justifyContent: "space-around", paddingBottom: 12, flexShrink: 0 }}>
      <NavItem icon="🏠" label="Accueil" active onClick={() => go("c_accueil")} />
      <NavItem icon="🌍" label="Fil Général" onClick={() => go("c_fil_general")} />
      <NavItem icon="📸" label="Scanner" onClick={() => go("c_appareil")} />
      <NavItem icon="📁" label="Mon Fil" onClick={() => go("c_fil_perso")} />
      <NavItem icon="👤" label="Profil" onClick={() => go("c_fil_user")} />
    </div>
  </>);
}

function C_AppareilPhoto({ go }) {

    <div style={{ height: 70, background: "#fff", borderTop: "1px solid #eaede7", display: "flex", alignItems: "center", justifyContent: "space-around", paddingBottom: 12, flexShrink: 0 }}>

    { id: "m_historique", l: "Historique" }, { id: "m_envoyer_expert", l: "Envoyer Expert" },
    { id: "m_confirmation", l: "Confirmation" },
  ],
  expert: [
    { id: "e_tdb", l: "Tableau de Bord" }, { id: "e_analyse", l: "Analyse" },
    { id: "e_saisie_info", l: "Saisie Info" }, { id: "e_validation", l: "Validation" },
    { id: "e_modification", l: "Modification" }, { id: "e_chatbox", l: "Chatbox" },
    { id: "e_details_signalement", l: "Détails" }, { id: "e_confirmation", l: "Confirmation" },
  ],
  admin: [
    { id: "a_console", l: "Console" }, { id: "a_creation", l: "Création" },
    { id: "a_validation", l: "Validation" }, { id: "a_supprimer", l: "Supprimer" },
    { id: "a_sauvegarde", l: "Sauvegarde" }, { id: "a_fin_tache", l: "Fin tâche" },
  ],
};

const App = function QuesacoComplete() {
  const [role, setRole] = useState("collegien");
  const [screen, setScreen] = useState("c_accueil");

  const handleRoleChange = (r) => {
    setRole(r);
    const first = ROLE_SCREENS[r][0].id;
    setScreen(first);
  };

  const ScreenComp = ALL_SCREENS[screen] || C_Accueil;
  const r = ROLES[role];

  return (
    <div style={{
      "--f": "'Nunito', sans-serif",
      "--main": r.color,
      "--accent": r.accent,
      minHeight: "100vh",
      background: `linear-gradient(160deg, #0f0f1a 0%, ${r.color}22 50%, #0f0f1a 100%)`,
      padding: "24px 16px",
      display: "flex", flexDirection: "column", alignItems: "center",
      fontFamily: "var(--f)",
    }}>
      <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

      <h1 style={{ color: "#fff", fontSize: 24, fontWeight: 900, margin: "0 0 2px", fontFamily: "var(--f)" }}>🌿 Maquettes Quésaco</h1>
      <p style={{ color: "#64748b", fontSize: 12, margin: "0 0 16px", fontFamily: "var(--f)" }}>Équipe ISiatech (4) — Navigation complète</p>

      {/* Role selector */}
      <div style={{ display: "flex", gap: 6, marginBottom: 12, flexWrap: "wrap", justifyContent: "center" }}>
        {Object.entries(ROLES).map(([k, v]) => (
          <button key={k} onClick={() => handleRoleChange(k)} style={{
            border: role === k ? `2px solid ${v.accent}` : "1px solid rgba(255,255,255,0.1)",
            background: role === k ? `${v.accent}22` : "rgba(255,255,255,0.03)",
            color: role === k ? v.accent : "#64748b",
            borderRadius: 12, padding: "8px 16px", fontSize: 13, fontWeight: role === k ? 800 : 500,
            cursor: "pointer", fontFamily: "var(--f)", transition: "all 0.2s",
          }}>{v.label}</button>
        ))}
      </div>

      {/* Screen selector */}
      <div style={{ display: "flex", gap: 5, marginBottom: 20, flexWrap: "wrap", justifyContent: "center", maxWidth: 500 }}>
        {ROLE_SCREENS[role].map(s => (
          <button key={s.id} onClick={() => setScreen(s.id)} style={{
            border: screen === s.id ? `1px solid ${r.accent}` : "1px solid rgba(255,255,255,0.08)",
            background: screen === s.id ? `${r.accent}18` : "rgba(255,255,255,0.02)",
            color: screen === s.id ? r.accent : "#4b5563",
            borderRadius: 8, padding: "5px 10px", fontSize: 10, fontWeight: screen === s.id ? 700 : 500,
            cursor: "pointer", fontFamily: "var(--f)", transition: "all 0.15s",
          }}>{s.l}</button>
        ))}
      </div>

      {/* Phone */}
      <Phone>
        <ScreenComp go={setScreen} />
      </Phone>

      <p style={{ color: "#475569", fontSize: 10, marginTop: 16, fontFamily: "var(--f)", textAlign: "center" }}>
        Navigation interactive — Cliquer les boutons pour explorer
      </p>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
